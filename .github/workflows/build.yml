name: Build

# Mirrors ~/Documents/diaryapp: nothing builds on a plain push. A v* tag is the only
# automatic trigger; workflow_dispatch is the manual escape hatch. Trade-off, accepted
# deliberately for a single-developer app pushing straight to main: a broken commit is
# not caught until the next tag or manual run. There is no unit-test suite in this
# project, so there is no separate `test` job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# gradle.properties pins org.gradle.java.home to a local path (the system default JRE
# has no compiler). Overriding it per-invocation keeps the local setup working while
# letting the runner use whatever JDK setup-java installed.
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # One job builds the installable APK, signed with the release key whenever the
  # secrets are present. Signing *every* build this job runs for, not just tagged
  # ones, is what makes the app updatable in place: Android refuses to install an
  # APK over one signed with a different key, so one key throughout means every
  # install is an upgrade.
  apk:
    name: APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # Secrets are not available to job-level `if`, so the decision is made here
      # and every later step keys off it.
      - name: Are the signing secrets set?
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — building an unsigned debug APK instead. See CLAUDE.md."
          fi

      # A tagged release that isn't signed is worse than no release: it can't be
      # installed over the previous version and it looks official. Fail instead.
      - name: A tag must be signed
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available != 'true'
        run: |
          echo "::error::Tagged release needs KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
          exit 1

      - name: Restore keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${KEYSTORE_BASE64}" | base64 -d > markdown-capture-release.jks
          cat > keystore.properties <<EOF
          storeFile=markdown-capture-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # Fail in seconds with a precise message rather than four minutes into the Gradle
      # build with a generic "Given final block not properly padded". The export to a
      # throwaway PKCS12 is the only keytool operation that actually unlocks the key.
      - name: Check the keystore passwords
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -uo pipefail
          if ! keytool -list -keystore markdown-capture-release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore."; exit 1
          fi
          if ! keytool -list -keystore markdown-capture-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEY_ALIAS '$KEY_ALIAS' is not in the keystore."; exit 1
          fi
          if ! keytool -importkeystore -noprompt \
                -srckeystore markdown-capture-release.jks -srcstorepass "$KEYSTORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
                -destkeystore /tmp/check.p12 -deststoretype PKCS12 \
                -deststorepass "$KEY_PASSWORD" -destkeypass "$KEY_PASSWORD" >/dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock key '$KEY_ALIAS' (store password is fine)."; exit 1
          fi
          rm -f /tmp/check.p12
          echo "Keystore, alias and both passwords check out."

      - name: Assemble
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME"
            cp app/build/outputs/apk/release/app-release.apk markdown-capture.apk
          else
            ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"
            cp app/build/outputs/apk/debug/app-debug.apk markdown-capture.apk
          fi

      # app/build.gradle.kts deliberately degrades to an unsigned APK when
      # keystore.properties is absent, which is right for a fresh clone but would
      # mean a broken secret silently ships something uninstallable. Prove it.
      - name: Verify the signature
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs markdown-capture.apk

      # Always, including when a step above failed — no key material left behind.
      - name: Shred keystore
        if: always()
        run: rm -f markdown-capture-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: markdown-capture-apk
          path: markdown-capture.apk
          if-no-files-found: error
          # Short-lived convenience copy (served as a zip). The tagged release below
          # carries the same .apk as a direct download and is not billed as Actions storage.
          retention-days: 30

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: markdown-capture.apk
